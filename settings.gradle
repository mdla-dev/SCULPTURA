pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
        maven {
            name = "MinecraftForge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "SpongePowered"
            url = "https://repo.spongepowered.org/repository/maven-public/"
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = "sculptura"

include(":core")
include(":common")

// Fabric Targets
include(":platforms:fabric-1.20.1")
include(":platforms:fabric-1.21.1")
include(":platforms:fabric-1.21.11")

// Forge Targets
include(":platforms:forge-1.18.2")
include(":platforms:forge-1.19.2")
include(":platforms:forge-1.20.1")

// NeoForge Targets
include(":platforms:neoforge-1.21.1")
include(":platforms:neoforge-1.21.4")
include(":platforms:neoforge-1.21.11")
